name: aliyun_fusion_auth
description: An independent Flutter plugin for Alibaba Cloud Fusion Authentication on Android and iOS, with explicit consent and server-verifiable tokens.
version: 0.1.8
homepage: https://pub.dev/publishers/nohup.life
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
topics:
  - aliyun
  - authentication
  - phone
  - sms
platforms:
  android:
  ios:
flutter:
  plugin:
    platforms:
      android:
        package: dev.aliyunfusionauth.flutter
        pluginClass: AliyunFusionAuthPlugin
      ios:
        pluginClass: AliyunFusionAuthPlugin
