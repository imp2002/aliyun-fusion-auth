name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, test, and validate package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install clang-format 21
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install clang-format==21.1.8
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
      - name: Run project checks
        run: sh tool/check.sh
      - name: Test release validation
        run: python3 .github/scripts/test_prepare_release.py
      - name: Validate pub.dev package
        run: flutter pub publish --dry-run

  ios-cleanup:
    name: iOS cleanup tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sh test/native/run_cleanup_tests.sh
